name: DAST (ZAP vs in-CI app)

# Dynamic scan on every change: boots the real Docker image inside the runner
# and runs the OWASP ZAP baseline scan against it. This produces the
# "repeated DAST during implementation" evidence without needing the live VM.
# (The separate zap-baseline.yml workflow targets the deployed HTTPS site.)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  # Cancel superseded runs on PR branches only — on main every merge commit
  # keeps its own complete validation record (and evidence screenshot).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zap-baseline:
    name: ZAP Baseline vs containerized app
    runs-on: ubuntu-latest

    # The base compose file guards SECRET_KEY with ${SECRET_KEY:?}, which is
    # resolved at compose-parse time from the shell environment — so every
    # step that touches compose needs it set. Throwaway value, CI only.
    env:
      SECRET_KEY: ci-dast-throwaway-secret-not-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start the app container
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build web

      - name: Wait for app to become healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "App healthy after $i attempts"; exit 0
            fi
            sleep 3
          done
          echo "::error::App did not become healthy in time"
          docker compose logs web
          exit 1

      # The ZAP action runs its container with host networking, so
      # localhost:8000 is reachable. If that ever changes, switch the target
      # to http://172.17.0.1:8000 (the runner's docker bridge address).
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          rules_file_name: security/zap/zap-baseline.conf
          fail_action: warn
          allow_issue_writing: false
          artifact_name: zap-report-${{ github.run_number }}

      - name: Show app logs (debug aid)
        if: always()
        run: docker compose logs --tail=100 web
