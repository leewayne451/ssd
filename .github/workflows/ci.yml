name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least-privilege token: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches only — on main every merge commit
  # keeps its own complete validation record (and evidence screenshot).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # NOTE: this job name is referenced by the branch-protection rule on main.
    # Do not rename without updating the required status checks.
    name: Run Tests and Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-ai.txt is CI-only tooling (tests/ai_review imports it);
          # it is never installed in the deployed application.
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-ai.txt

      - name: Run unit tests (with JUnit + coverage reports)
        run: >
          pytest
          --junitxml=reports/junit.xml
          --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term

      - name: Run dependency audit (pip-audit)
        run: |
          mkdir -p reports
          # JSON report for the D2 evidence pack (always produced) …
          pip-audit -f json -o reports/pip-audit.json || AUDIT_FAILED=1
          # … and a human-readable gate that fails the build on findings.
          if [ "${AUDIT_FAILED:-0}" = "1" ]; then
            echo "::error::pip-audit found vulnerable dependencies (see artifact)"
            pip-audit
            exit 1
          fi
          pip-audit

      # Evidence for D2 §3 (test automation + dependency check) — downloadable
      # from every run, pass or fail.
      - name: Upload test & audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_number }}
          path: reports/
          retention-days: 90
