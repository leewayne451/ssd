name: OWASP ZAP Baseline Scan

# On-demand DAST against the DEPLOYED site (per-PR DAST runs in dast-zap.yml
# against an in-CI container instead). Run after significant merges to keep
# live-site scan evidence current.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan"
        required: true
        default: "https://chateaucollective.duckdns.org"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Run OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set APP_URL secret in repo Settings once AWS deploy is live, then
      # replace inputs.target_url with secrets.APP_URL and restore push trigger.
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url }}
          rules_file_name: security/zap/zap-baseline.conf
          fail_action: warn
          allow_issue_writing: false
