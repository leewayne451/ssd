# Advisory AI review of pull requests (security, design drift, test gaps).
#
# Trust model: this workflow runs via workflow_run, so it always executes the
# version of this file and of tools/ai_review from the DEFAULT branch. It
# never checks out, imports or executes pull-request head code; the PR diff
# is fetched through the GitHub API strictly as text. Fork PRs are skipped so
# OPENAI_API_KEY is never spent on untrusted external activity.
#
# This workflow is advisory only: it cannot approve, request changes, merge,
# or alter scanner/CI results. See docs/ai-review-setup.md.

name: AI Contextual PR Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  review:
    name: AI PR review (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repository pull-request runs only, and only after CI succeeded.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read        # check out trusted default-branch tooling
      actions: read         # inspect the triggering workflow run
      pull-requests: write  # upsert the single review comment
      issues: write         # PR conversation comments use the issues endpoint
    concurrency:
      group: ai-pr-review-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true

    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI tooling dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-ai.txt

      - name: Resolve associated pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")
                       | select(.head.repo.full_name == .base.repo.full_name)
                       | .number][0] // empty')"
          if [ -z "${pr_number}" ]; then
            echo "No associated open same-repository pull request; skipping."
          else
            echo "Resolved pull request #${pr_number}."
          fi
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Run AI contextual review
        if: steps.pr.outputs.number != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: python -m tools.ai_review.review_pr
