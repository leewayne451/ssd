{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit' if listing else 'Create' }} Listing</h1>
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input name="title" class="form-control" maxlength="200" value="{{ listing.title if listing else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" maxlength="5000">{{ listing.description if listing else '' }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Category</label>
    <input name="category" class="form-control" maxlength="50" value="{{ listing.category if listing else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Brand</label>
    <input name="brand" class="form-control" maxlength="100" value="{{ listing.brand if listing else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Condition</label>
    <select name="condition" class="form-select">
      <option value="">Select condition</option>
      {% for c in conditions %}
      <option value="{{ c }}" {% if listing and listing.condition == c %}selected{% endif %}>{{ c.replace('_', ' ') }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Price</label>
    <input name="price" class="form-control" type="number" min="0.01" step="0.01" value="{{ listing.price if listing else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Image</label>
    <input name="image" type="file" class="form-control">
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
