# Château Collective — nginx reverse proxy (HTTP, Phase 1)
# Mounted at /etc/nginx/conf.d/default.conf inside the nginx container.
#
# This HTTP-only config lets the stack come up and auto-deploy immediately.
# Once you have TLS certs (see deploy/README.md), switch the compose mount to
# deploy/nginx/chateau-collective.tls.conf to enable HTTPS.

upstream chateau_app {
    server web:8000;          # 'web' = the app service name on the compose network
}

# ---------------------------------------------------------------------------
# Edge rate limiting + bot filtering (FSR-05/06/23/24, NFSR-12, SDR-15).
# These complement the app's per-account lockout with per-IP throttling that
# an application-level control can't see. Zones live in the http context.
# ---------------------------------------------------------------------------
# Auth endpoints: brute-force / credential-stuffing / fake-registration.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
# Search/browse: scraping / search flooding.
limit_req_zone $binary_remote_addr zone=search_zone:10m rate=30r/m;
# General traffic ceiling.
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=120r/m;
# Concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# Return 429 (not the default 503) so clients/tests see a rate-limit signal.
limit_req_status 429;
limit_conn_status 429;

# Block obvious scraping/scanning user agents outright (SDR-15 / FSR-24).
map $http_user_agent $bad_bot {
    default                 0;
    ""                      1;   # empty UA
    "~*(sqlmap|nikto|nmap|masscan|acunetix|nessus)" 1;
    "~*(python-requests|curl|wget|go-http-client|libwww-perl|scrapy)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Match the app's upload size policy.
    client_max_body_size 10M;

    limit_conn conn_per_ip 20;
    limit_req  zone=general_zone burst=60 nodelay;

    # Reject known bad/automated agents before they reach the app.
    if ($bad_bot) { return 403; }

    # ACME HTTP-01 challenge — used by certbot when you enable TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health endpoint: kept on plain HTTP (no redirect) so deploy/uptime probes
    # can always reach it.
    location = /healthz {
        proxy_pass http://chateau_app;
        access_log off;
    }

    # Tight per-IP throttle on authentication endpoints.
    location ~ ^/auth/(login|register) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Looser throttle on public search/browse.
    location /listings {
        limit_req zone=search_zone burst=20 nodelay;
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
