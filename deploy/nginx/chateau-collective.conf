# Château Collective — nginx reverse proxy (HTTP, Phase 1)
# Mounted at /etc/nginx/conf.d/default.conf inside the nginx container.
#
# This HTTP-only config lets the stack come up and auto-deploy immediately.
# Once you have TLS certs (see deploy/README.md), switch the compose mount to
# deploy/nginx/chateau-collective.tls.conf to enable HTTPS.

upstream chateau_app {
    server web:8000;          # 'web' = the app service name on the compose network
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Match the app's upload size policy.
    client_max_body_size 10M;

    # ACME HTTP-01 challenge — used by certbot when you enable TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health endpoint: kept on plain HTTP (no redirect) so deploy/uptime probes
    # can always reach it.
    location = /healthz {
        proxy_pass http://chateau_app;
        access_log off;
    }

    location / {
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
