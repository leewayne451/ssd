# Château Collective — nginx reverse proxy WITH TLS (Phase 2)
#
# Enable after obtaining certificates (see deploy/README.md). To activate, point
# the nginx mount in docker-compose.yml at this file:
#   - ./deploy/nginx/chateau-collective.tls.conf:/etc/nginx/conf.d/default.conf:ro
# then `docker compose up -d`. /etc/letsencrypt is already mounted in compose.
#
# Domain: chateaucollective.duckdns.org (DuckDNS) — if the VM's public IP ever
# changes (e.g. after an EC2 reset), update it in the DuckDNS dashboard only;
# this config keys off the hostname and needs no edit.

upstream chateau_app {
    server web:8000;
}

# ---------------------------------------------------------------------------
# Edge rate limiting + bot filtering (FSR-05/06/23/24, NFSR-12, SDR-15).
# Complements the app's per-account lockout with per-IP throttling. Zones
# live in the http context. See deploy/README.md for the throttling rationale.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=search_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_user_agent $bad_bot {
    default                 0;
    ""                      1;
    "~*(sqlmap|nikto|nmap|masscan|acunetix|nessus)" 1;
    "~*(python-requests|curl|wget|go-http-client|libwww-perl|scrapy)" 1;
}

# ---------------------------------------------------------------------------
# HTTP :80 — serve ACME challenges + health, redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name chateaucollective.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health stays on HTTP (no redirect) for deploy/uptime probes.
    location = /healthz {
        proxy_pass http://chateau_app;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chateaucollective.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/chateaucollective.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chateaucollective.duckdns.org/privkey.pem;

    # --- TLS policy ---------------------------------------------------------
    # Only modern protocols. TLS 1.0/1.1 are disabled (POODLE/BEAST-era, weak).
    ssl_protocols TLSv1.2 TLSv1.3;
    # ECDHE = forward secrecy; AES-GCM / ChaCha20-Poly1305 = AEAD (auth'd
    # encryption). (Note: TLS 1.3 cipher selection is fixed by OpenSSL; this
    # list governs TLS 1.2.)
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp384r1;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling (faster, more private cert revocation checks).
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (HSTS, CSP, XFO, XCTO, Referrer-Policy) are set by the
    # application (app/security/headers.py) — single source of truth. Duplicating
    # them here caused doubled headers on every response (flagged by ZAP).

    client_max_body_size 10M;

    limit_conn conn_per_ip 20;
    limit_req  zone=general_zone burst=60 nodelay;

    if ($bad_bot) { return 403; }

    location = /healthz {
        proxy_pass http://chateau_app;
        access_log off;
    }

    location ~ ^/auth/(login|register) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /listings {
        limit_req zone=search_zone burst=20 nodelay;
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://chateau_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
